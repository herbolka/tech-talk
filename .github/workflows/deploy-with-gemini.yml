name: AI Agent Deploy Pipeline

on:
  push:
    branches: [tech-talk-feature-ai-agent-deploy]

env:
  AWS_REGION: us-east-1
  EKS_CLUSTER: currency-cluster
  ECR_REPOSITORY: currency-conversion-service

jobs:

  gemini-code-review:
    name: Gemini code review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - name: Review changes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git diff HEAD~1 HEAD > changes.diff
          gemini -m gemini-2.5-flash-lite -p "
            Review this git diff. Check Dockerfile, Terraform, and Kubernetes configs.
            Look for security issues, missing resource limits, and misconfigurations.
            Output: PASS or FAIL with a one-line reason.
          " < changes.diff

  terraform:
    name: Provision infrastructure
    runs-on: ubuntu-latest
    needs: gemini-code-review
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve tfplan

  build-push:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: terraform
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        id: push
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "$REGISTRY/$ECR_REPOSITORY:$TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:latest" .
          docker push "$REGISTRY/$ECR_REPOSITORY:$TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          echo "image=$REGISTRY/$ECR_REPOSITORY:$TAG" >> $GITHUB_OUTPUT

  deploy-k8s:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Create ECR pull secret
        run: |
          kubectl create secret docker-registry ecr-secret \
            --docker-server=$(aws sts get-caller-identity --query Account --output text).dkr.ecr.$AWS_REGION.amazonaws.com \
            --docker-username=AWS \
            --docker-password=$(aws ecr get-login-password --region $AWS_REGION) \
            --namespace=production \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/namespace.yml
          kubectl apply -f k8s/configmap.yml  -n production
          kubectl apply -f k8s/service.yml    -n production
          kubectl apply -f k8s/deployment.yml -n production
          kubectl apply -f k8s/hpa.yml        -n production
          kubectl apply -f k8s/pdb.yml        -n production

      - name: Update image
        run: |
          kubectl set image deployment/currency-conversion-service \
            currency-conversion=${{ needs.build-push.outputs.image }} \
            -n production

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/currency-conversion-service \
            -n production --timeout=5m

  gemini-validate:
    name: Gemini validation
    runs-on: ubuntu-latest
    needs: deploy-k8s
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name $EKS_CLUSTER --region $AWS_REGION

      - name: Validate deployment
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          kubectl get pods,svc,hpa -n production -o json | \
          gemini -m gemini-2.5-flash-lite -p "
            Is this Kubernetes deployment healthy?
            Output: HEALTHY or UNHEALTHY with pod count and external IP.
          "